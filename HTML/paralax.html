<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax</title>
    <link rel="stylesheet" href="../CSS/paralax.css">
</head>
<body>
    <section class="hero">
        <h1>Открой Вселенную</h1>
    </section>

    <section class="parallax parallax--stars">
        <div class="parallax__content">
            <h2>Звёздные поля</h2>
            <p>Миллиарды звёзд ждут вас за пределами Земли. Исследуйте бескрайние просторы космоса и откройте для себя удивительные миры.</p>
        </div>
    </section>

    <section class="parallax parallax--nebula">
        <div class="parallax__content">
            <h2>Туманности</h2>
            <p>Цветные облака газа - колыбели новых звёзд. Насладитесь красотой космических образований, где рождаются новые солнечные системы.</p>
            <button>Узнать больше</button>
        </div>
    </section>
</body>
</html>
