<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>countdown_till_newYear</title>
</head>
<body>
    <h2>До нового 2026 года осталось:</h2>
    <div id="countdown">Загрузка...</div>

    <script>
        const tgtDate = new Date('January 1, 2026 00:00:00').getTime()
        const countdownElem = document.getElementById('countdown')

        const updateCountdown = () => {
            const current = new Date().getTime()
            const diff = tgtDate - current

            if (diff < 0) {
                countdownElem.innerHTML = 'Новый год уже наступил'
                return
            }
            else{
                const days = Math.floor(diff / (1000 * 60 * 60 * 24))
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))
                const minutes = Math.floot((diff % (1000 * 60 * 60)) / (1000 * 60))
                const seconds = Math.floor((diff % (1000 * 60)) / 1000)

                countdownElem.innerHTML = `${days} дн. ${hours} ч. ${minutes} мин. ${seconds} сек.`
            }
        }

        setInterval(updateCountdown, 1000)
        updateCountdown()
    </script>
</body>
</html>
